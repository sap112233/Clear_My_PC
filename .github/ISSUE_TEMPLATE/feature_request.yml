name: Feature request
description: Suggest an improvement or new capability.
title: "Feature: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the task or situation you want to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe your proposed behavior or outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Optional. Mention workarounds or platforms affected.
    validations:
      required: false
