name: Bug report
description: Report a reproducible problem with DesktopKeeper.
title: "Bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this public form. See [SECURITY.md](https://github.com/sap112233/Clear_My_PC/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: DesktopKeeper version
      description: For example, 1.4.2.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system and version
      placeholder: Windows 11, macOS 15, Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the screen or feature involved and any error message.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Choose…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. Remove personal information from logs or screenshots before sharing.
    validations:
      required: false
