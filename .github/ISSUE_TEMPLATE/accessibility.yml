name: Accessibility barrier
description: Report an accessibility barrier or ask for help with access.
title: "Accessibility: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        You do not need to disclose a disability. Screenshots and recordings are optional. Do not include passwords, private files, or other sensitive information.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: DesktopKeeper version and operating system/version
      placeholder: DesktopKeeper 1.4.2, Windows 11
    validations:
      required: false
  - type: input
    id: assistive-technology
    attributes:
      label: Input method or assistive technology
      description: Optional. Share this only if you are comfortable doing so.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. A workaround or link to a relevant screen can be helpful.
    validations:
      required: false
